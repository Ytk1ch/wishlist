<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WISHLIST</title>
<meta name="theme-color" content="#0a0a0f">
<meta name="description" content="Виш-лист Данилы: выбирай, что подарить на день рождения. Угадаешь топ?">
<meta property="og:type" content="website">
<meta property="og:title" content="WISHLIST — что подарить Даниле">
<meta property="og:description" content="Подарки на выбор, цены, ссылки и мои комментарии. Топ откроется 23 ноября.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700&family=Russo+One&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --panel: #12131b;
    --yellow: #fcee09;
    --cyan: #02d7f2;
    --red: #ff2a4d;
    --fg: #ececec;
    --muted: #8a8f9a;
    --head: "Russo One", "Arial Black", sans-serif;
    --body: "Exo 2", system-ui, sans-serif;
    --cut: 16px;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg);
    font-family: var(--body); font-size: 16px; line-height: 1.45;
    background-image:
      linear-gradient(rgba(252,238,9,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(252,238,9,.035) 1px, transparent 1px);
    background-size: 44px 44px;
  }
  body.locked { overflow: hidden; }
  /* мягкое неоновое свечение по углам, под содержимым (полосок поверх сайта больше нет) */
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: -1;
    background:
      radial-gradient(45vw 45vh at 0% 60%, rgba(252,238,9,.06), transparent 70%),
      radial-gradient(60vw 55vh at 100% 100%, rgba(2,215,242,.08), transparent 70%);
  }
  /* полоски остались только на заставке */
  #intro::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0 1px, transparent 1px 3px);
  }

  /* ---------- ЗАСТАВКА ---------- */
  #intro {
    position: fixed; inset: 0; z-index: 100; background: #050507;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    cursor: pointer; overflow: hidden;
  }
  #intro::before { /* бегущая полоса помех */
    content: ""; position: absolute; left: 0; right: 0; height: 18%; top: -20%;
    background: linear-gradient(transparent, rgba(252,238,9,.10), transparent);
    animation: sweep 2.2s linear infinite;
  }
  @keyframes sweep { to { top: 120%; } }
  .glitch {
    position: relative; font-family: var(--head); color: var(--yellow);
    font-size: clamp(44px, 15vw, 190px); letter-spacing: .04em; line-height: 1;
    text-shadow: 0 0 22px rgba(252,238,9,.45);
    animation: flick 2.6s steps(1) infinite;
  }
  .glitch::before, .glitch::after {
    content: attr(data-text); position: absolute; inset: 0; overflow: hidden;
    clip-path: inset(0 0 100% 0); /* без анимации слои спрятаны */
  }
  .glitch::before { color: var(--cyan); text-shadow: none; animation: sliceA 1.1s steps(1) infinite; transform: translate(-4px, 0); }
  .glitch::after  { color: var(--red);  text-shadow: none; animation: sliceB 1.4s steps(1) infinite; transform: translate(4px, 0); }
  @keyframes sliceA {
    0%   { clip-path: inset(10% 0 80% 0); transform: translate(-6px,0); }
    14%  { clip-path: inset(55% 0 20% 0); transform: translate(5px,0); }
    28%  { clip-path: inset(0 0 95% 0);   transform: translate(-2px,0); }
    42%  { clip-path: inset(78% 0 4% 0);  transform: translate(8px,0); }
    57%  { clip-path: inset(30% 0 52% 0); transform: translate(-8px,0); }
    71%  { clip-path: inset(90% 0 0 0);   transform: translate(3px,0); }
    85%  { clip-path: inset(42% 0 40% 0); transform: translate(-4px,0); }
    100% { clip-path: inset(0 0 100% 0);  transform: translate(0,0); }
  }
  @keyframes sliceB {
    0%   { clip-path: inset(70% 0 10% 0); transform: translate(6px,0); }
    16%  { clip-path: inset(8% 0 82% 0);  transform: translate(-7px,0); }
    33%  { clip-path: inset(46% 0 40% 0); transform: translate(4px,0); }
    50%  { clip-path: inset(85% 0 2% 0);  transform: translate(-3px,0); }
    66%  { clip-path: inset(20% 0 66% 0); transform: translate(9px,0); }
    83%  { clip-path: inset(60% 0 24% 0); transform: translate(-5px,0); }
    100% { clip-path: inset(0 0 100% 0);  transform: translate(0,0); }
  }
  @keyframes flick {
    0%,100% { opacity: 1; } 6% { opacity: .15; } 8% { opacity: 1; } 31% { opacity: .55; }
    33% { opacity: 1; } 64% { opacity: .2; } 66% { opacity: 1; } 67% { opacity: .4; } 69% { opacity: 1; }
  }
  .boot {
    margin-top: 28px; font-family: var(--head); font-size: clamp(11px, 2.6vw, 15px);
    letter-spacing: .25em; color: var(--cyan); text-align: center;
  }
  .bar { width: min(320px, 70vw); height: 4px; margin: 14px auto 0; background: #1b1c26; }
  .bar i { display: block; height: 100%; width: 0; background: var(--yellow); box-shadow: 0 0 10px var(--yellow); animation: load 2.3s ease-in forwards; }
  @keyframes load { to { width: 100%; } }
  .skip { position: absolute; bottom: 22px; font-size: 12px; letter-spacing: .2em; color: var(--muted); }
  #intro.out { animation: out .55s steps(1) forwards; pointer-events: none; }
  #intro.out .glitch { animation: flick .12s steps(1) infinite; }
  @keyframes out {
    0%   { transform: translate(0,0); opacity: 1; filter: none; }
    20%  { transform: translate(-14px,3px) skewX(6deg); filter: hue-rotate(60deg); }
    40%  { transform: translate(18px,-4px) skewX(-8deg); opacity: .8; }
    60%  { transform: translate(-8px,0) scaleY(.04); opacity: 1; filter: brightness(2); }
    80%  { transform: translate(0,0) scaleY(.005); opacity: .9; }
    100% { transform: scaleY(0); opacity: 0; }
  }

  /* ---------- ШАПКА ---------- */
  header.top { padding: 28px 16px 8px; text-align: center; }
  header.top h1 {
    margin: 0; font-family: var(--head); font-weight: 400; color: var(--yellow);
    font-size: clamp(30px, 7vw, 56px); letter-spacing: .06em; text-shadow: 2px 0 var(--cyan), -2px 0 var(--red);
  }
  header.top p { margin: 6px 0 0; color: var(--muted); letter-spacing: .12em; font-size: 14px; text-transform: uppercase; }

  nav.tabs {
    position: sticky; top: 0; z-index: 20; display: flex; gap: 8px; padding: 12px 16px;
    overflow-x: auto; scrollbar-width: none; justify-content: center;
    background: linear-gradient(var(--bg) 70%, transparent);
  }
  nav.tabs::-webkit-scrollbar { display: none; }
  /* на телефоне все вкладки видны сразу, в несколько строк */
  @media (max-width: 700px) { nav.tabs { flex-wrap: wrap; justify-content: center; position: static; } }
  .tab {
    flex: none; cursor: pointer; border: 1px solid #3a3b48; background: transparent; color: var(--fg);
    font-family: var(--head); font-size: 14px; letter-spacing: .1em; padding: 10px 18px;
    clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
    transition: color .15s, background .15s, transform .15s;
  }
  .tab:hover { color: var(--yellow); border-color: var(--yellow); }
  .tab.on { background: var(--yellow); color: #0a0a0f; border-color: var(--yellow); }
  .tab small { opacity: .6; margin-left: 6px; font-family: var(--body); font-weight: 700; }

  /* ---------- КАРТОЧКИ ---------- */
  main { max-width: 1180px; margin: 0 auto; padding: 12px 16px 80px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 22px; }
  .card {
    --c: #3a3b48; padding: 1px; background: var(--c);
    clip-path: polygon(0 0, calc(100% - var(--cut)) 0, 100% var(--cut), 100% 100%, var(--cut) 100%, 0 calc(100% - var(--cut)));
    animation: appear .55s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i) * 70ms);
    transition: transform .2s, background .2s;
  }
  .card:hover { --c: var(--yellow); transform: translateY(-4px); }
  .card-in {
    background: var(--panel); height: 100%; padding: 18px; display: flex; flex-direction: column; gap: 14px;
    clip-path: polygon(0 0, calc(100% - var(--cut) + 1px) 0, 100% calc(var(--cut) - 1px), 100% 100%, calc(var(--cut) - 1px) 100%, 0 calc(100% - var(--cut) + 1px));
  }
  @keyframes appear {
    0% { opacity: 0; transform: translateY(18px) skewX(-4deg); filter: hue-rotate(80deg) brightness(1.8); }
    50% { opacity: .8; transform: translateX(-4px); }
    100% { opacity: 1; transform: none; filter: none; }
  }
  .card h2 { margin: 0; font-family: var(--head); font-weight: 400; font-size: 22px; letter-spacing: .03em; color: var(--yellow); }
  .note { margin: -8px 0 0; color: var(--muted); font-size: 14px; }

  .var { display: grid; grid-template-columns: 1fr; gap: 10px; padding-top: 14px; border-top: 1px dashed #30313e; position: relative; }
  .var:first-of-type { border-top: 0; padding-top: 0; }
  .multi .var { grid-template-columns: 92px 1fr; align-items: center; }
  .pic {
    aspect-ratio: 4 / 3; background: #0b0c12; border: 1px solid #23242f; display: grid; place-items: center; overflow: hidden;
  }
  .multi .pic { aspect-ratio: 1; }
  .pic:has(img) { background: #fff; }
  .pic { position: relative; }
  .pic img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; }
  .pic.empty { color: #3b3d4c; font-family: var(--head); font-size: 11px; letter-spacing: .2em; text-align: center; }
  .label { font-weight: 700; }
  .price { font-family: var(--head); font-size: 24px; color: var(--cyan); }
  .price.na { font-size: 14px; color: var(--muted); letter-spacing: .08em; }
  .badge {
    display: inline-block; margin-left: 8px; padding: 2px 8px; vertical-align: middle;
    font-family: var(--head); font-size: 10px; letter-spacing: .12em; background: var(--red); color: #fff;
  }
  .buy {
    display: block; text-align: center; text-decoration: none; margin-top: 6px; padding: 10px 14px;
    font-family: var(--head); font-size: 13px; letter-spacing: .14em;
    background: var(--yellow); color: #0a0a0f;
    clip-path: polygon(0 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%);
    transition: background .15s, transform .15s;
  }
  .buy:hover { background: #fff; transform: translateX(3px); }
  .buy.off { background: #23242f; color: #5d6070; pointer-events: none; }
  .multi .buy { padding: 7px 12px; font-size: 12px; display: inline-block; }
  .multi .price { font-size: 20px; }

  .warn {
    margin-top: 8px; padding: 8px 12px; border: 1px solid var(--red); background: rgba(255,42,77,.09);
    color: var(--red); font-weight: 700; font-size: 14px; line-height: 1.35;
    animation: warnblink 2.4s steps(1) infinite;
  }
  .warn b {
    display: block; font-family: var(--head); font-weight: 400; font-size: 13px; letter-spacing: .18em;
    text-shadow: 0 0 8px rgba(255,42,77,.6);
  }
  @keyframes warnblink { 0%,100% { opacity: 1; } 90% { opacity: .45; } 93% { opacity: 1; } 96% { opacity: .6; } }
  .why {
    display: inline-block; margin-top: 8px; cursor: pointer; background: transparent; color: var(--cyan);
    border: 1px solid var(--cyan); padding: 6px 12px; font-family: var(--head); font-size: 11px; letter-spacing: .14em;
    transition: background .15s, color .15s;
  }
  .why:hover, .why[aria-expanded="true"] { background: var(--cyan); color: #0a0a0f; }
  .why::after { content: " +"; }
  .why[aria-expanded="true"]::after { content: " –"; }
  .comment {
    grid-column: 1 / -1; display: grid; grid-template-rows: 0fr; margin-top: -10px;
    transition: grid-template-rows .3s ease, margin-top .3s ease;
  }
  .comment.open { grid-template-rows: 1fr; margin-top: 0; }
  .comment > div { overflow: hidden; }
  /* как субтитры в звонке Cyberpunk: голубой ник и текст репликой */
  .comment p {
    margin: 0; padding: 14px 16px; white-space: pre-line; font-size: 16px; line-height: 1.5;
    background: rgba(2,215,242,.06); border-left: 3px solid var(--cyan);
  }
  .who {
    font-family: var(--head); color: var(--cyan); letter-spacing: .06em; margin-right: 6px;
    text-shadow: 0 0 10px rgba(2,215,242,.55);
  }
  .ch { opacity: 0; }
  .ch.on { opacity: 1; }
  .multi .why { margin-top: 6px; }

  .tab.top { border-color: var(--cyan); color: var(--cyan); }
  .tab.top:hover { color: #fff; border-color: #fff; }
  .tab.top.on { background: var(--cyan); color: #0a0a0f; border-color: var(--cyan); }
  .lockbox {
    grid-column: 1 / -1; text-align: center; padding: 56px 18px;
    border: 1px dashed #3a3b48; background: rgba(18,19,27,.7);
  }
  .lockbox .tag { font-family: var(--head); font-size: 13px; letter-spacing: .25em; color: var(--red); text-shadow: 0 0 8px rgba(255,42,77,.5); }
  .lockbox h2 { margin: 16px 0 20px; font-family: var(--head); font-weight: 400; font-size: clamp(20px, 5vw, 34px); letter-spacing: .05em; color: var(--yellow); }
  .lockbox .clock { font-family: var(--head); font-size: clamp(26px, 8vw, 54px); letter-spacing: .08em; color: var(--cyan); text-shadow: 0 0 14px rgba(2,215,242,.5); }
  .lockbox p { margin: 20px 0 0; color: var(--muted); }
  .card.first { --c: var(--yellow); }
  .place {
    align-self: flex-start; margin-bottom: -4px; padding: 4px 12px;
    background: var(--yellow); color: #0a0a0f; font-family: var(--head); font-size: 13px; letter-spacing: .14em;
  }
  .empty-state { text-align: center; padding: 80px 16px; color: var(--muted); font-family: var(--head); letter-spacing: .2em; }
  footer { text-align: center; padding: 30px 16px 50px; color: #4b4e5c; font-size: 12px; letter-spacing: .25em; }

  @media (prefers-reduced-motion: reduce) {
    .glitch, .glitch::before, .glitch::after, #intro::before, .card { animation: none !important; }
    .bar i { animation-duration: .8s; }
  }
</style>
</head>
<body class="locked">

<div id="intro" aria-label="Заставка">
  <div class="glitch" data-text="WISHLIST">WISHLIST</div>
  <div class="boot">// ЗАГРУЗКА ЖЕЛАНИЙ<div class="bar"><i></i></div></div>
  <div class="skip">НАЖМИ, ЧТОБЫ ПРОПУСТИТЬ</div>
</div>

<header class="top">
  <h1>WISHLIST</h1>
  <p>Выбирай, что подарить</p>
</header>
<nav class="tabs" id="tabs" aria-label="Категории"></nav>
<main><div class="grid" id="grid"></div></main>
<footer>// КОНЕЦ СПИСКА</footer>

<script src="gifts.js"></script>
<script>
(function () {
  var grid = document.getElementById("grid");
  var tabs = document.getElementById("tabs");
  var current = "all";

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function money(n) { return n.toLocaleString("ru-RU") + " ₽"; }

  function variantHtml(v, isCheapest) {
    var pic = v.img
      ? '<div class="pic"' + (v.bg ? ' style="background:' + esc(v.bg) + '"' : "") + '><img src="' + esc(v.img) + '" alt="' + esc(v.label) + '" loading="lazy"></div>'
      : '<div class="pic empty">НЕТ<br>ФОТО</div>';
    var price = typeof v.price === "number"
      ? '<div class="price">' + money(v.price) + "</div>"
      : '<div class="price na">ЦЕНА УТОЧНЯЕТСЯ</div>';
    var badge = isCheapest ? '<span class="badge">САМЫЙ ДЕШЁВЫЙ</span>' : "";
    var warn = v.warning ? '<div class="warn"><b>⚠ WARNING</b>' + esc(v.warning) + "</div>" : "";
    var btn = v.url
      ? '<a class="buy" href="' + esc(v.url) + '" target="_blank" rel="noopener">' + esc(v.btn || "ЗАКАЗАТЬ") + "</a>"
      : '<span class="buy off">ССЫЛКА СКОРО</span>';
    var why = v.comment
      ? '<br><button class="why" type="button" aria-expanded="false">КОММЕНТАРИЙ К ПОДАРКУ</button>'
      : "";
    var comment = v.comment
      ? '<div class="comment"><div><p><span class="who">Danya:</span>' +
        v.comment.split("").map(function (ch) { return ch === "\n" ? "\n" : '<span class="ch">' + esc(ch) + "</span>"; }).join("") +
        "</p></div></div>"
      : "";
    return '<div class="var">' + pic + "<div><div class=\"label\">" + esc(v.label) + badge + "</div>" + price + warn + btn + why + "</div>" + comment + "</div>";
  }

  function cardHtml(g, i) {
    var prices = g.variants.filter(function (v) { return typeof v.price === "number"; }).map(function (v) { return v.price; });
    var min = prices.length > 1 ? Math.min.apply(null, prices) : null;
    var minCount = prices.filter(function (p) { return p === min; }).length;
    var vs = g.variants.map(function (v) {
      return variantHtml(v, g.variants.length > 1 && min !== null && minCount === 1 && v.price === min);
    }).join("");
    return '<article class="card' + (g.variants.length > 1 ? " multi" : "") + '" style="--i:' + i + '"><div class="card-in">' +
      "<h2>" + esc(g.name) + "</h2>" + (g.note ? '<p class="note">' + esc(g.note) + "</p>" : "") + vs + "</div></article>";
  }

  /* ---------- ТОП ПОДАРКОВ: открывается 23.11.2026 в 00:00 по Москве и Санкт-Петербургу ---------- */
  var TOP_TAB = "ТОП ПОДАРКОВ";
  var UNLOCK = Date.parse("2026-11-23T00:00:00+03:00");
  var previewTop = /[?&]preview=1/.test(location.search); /* для проверки вручную: добавить ?preview=1 к адресу */
  var clockTimer = null;

  function topOpen() { return previewTop || Date.now() >= UNLOCK; }

  function getTop() {
    try {
      var json = new TextDecoder().decode(Uint8Array.from(atob(TOP_SECRET), function (c) { return c.charCodeAt(0); }));
      return JSON.parse(json);
    } catch (_) { return []; }
  }

  function pad(n) { return (n < 10 ? "0" : "") + n; }

  function tickClock() {
    var el = document.getElementById("clock");
    var left = UNLOCK - Date.now();
    if (left <= 0) { clearInterval(clockTimer); buildTabs(); render(); return; }
    if (!el) return;
    var s = Math.floor(left / 1000);
    var d = Math.floor(s / 86400), hh = Math.floor(s % 86400 / 3600), mm = Math.floor(s % 3600 / 60), ss = s % 60;
    el.textContent = d + " д  " + pad(hh) + ":" + pad(mm) + ":" + pad(ss);
  }

  function renderTop() {
    clearInterval(clockTimer);
    if (topOpen()) {
      var list = getTop().map(function (n) {
        return GIFTS.filter(function (g) { return g.name === n; })[0];
      }).filter(Boolean);
      grid.innerHTML = list.map(function (g, i) {
        var html = cardHtml(g, i);
        html = html.replace('class="card', 'class="card' + (i === 0 ? " first" : ""));
        return html.replace('<div class="card-in">', '<div class="card-in"><div class="place">МЕСТО №' + (i + 1) + "</div>");
      }).join("");
    } else {
      grid.innerHTML =
        '<div class="lockbox">' +
        '<div class="tag">// ДОСТУП ЗАКРЫТ</div>' +
        "<h2>ТОП ПОДАРКОВ ОТКРОЕТСЯ 23 НОЯБРЯ В 00:00</h2>" +
        '<div class="clock" id="clock">&nbsp;</div>' +
        "<p>Угадаешь, что я хочу больше всего? Узнаешь в день рождения.</p></div>";
      tickClock();
      clockTimer = setInterval(tickClock, 1000);
    }
  }

  function render() {
    clearInterval(clockTimer);
    if (current === "top") {
      renderTop();
    } else {
    var list = GIFTS.filter(function (g) { return current === "all" || g.cat === current; });
    grid.innerHTML = list.length
      ? list.map(cardHtml).join("")
      : '<div class="empty-state" style="grid-column:1/-1">// ПУСТО. ПОКА...</div>';
    }
    Array.prototype.forEach.call(grid.querySelectorAll(".pic img"), function (img) {
      img.addEventListener("error", function () {
        var p = img.parentNode; p.className = "pic empty"; p.innerHTML = "НЕТ<br>ФОТО";
      });
    });
    Array.prototype.forEach.call(tabs.children, function (b) {
      b.classList.toggle("on", b.dataset.id === current);
    });
  }

  grid.addEventListener("click", function (e) {
    var b = e.target.closest(".why"); if (!b) return;
    var box = b.closest(".var").querySelector(".comment");
    var open = !box.classList.contains("open");
    box.classList.toggle("open", open);
    b.setAttribute("aria-expanded", open ? "true" : "false");
    if (open) typeComment(box);
  });

  /* текст комментария "печатается" по буквам, один раз при первом открытии */
  var reduceMotion = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  function typeComment(box) {
    if (box.dataset.typed) return;
    box.dataset.typed = "1";
    var chars = box.querySelectorAll(".ch");
    if (reduceMotion) { Array.prototype.forEach.call(chars, function (c) { c.classList.add("on"); }); return; }
    var step = Math.min(22, 2600 / Math.max(chars.length, 1)), i = 0;
    var timer = setInterval(function () {
      if (i >= chars.length) { clearInterval(timer); return; }
      chars[i++].classList.add("on");
    }, step);
  }

  function buildTabs() {
    var items = [{ id: "all", name: "ВСЕ" }].concat(CATEGORIES);
    tabs.innerHTML = items.map(function (c) {
      var n = c.id === "all" ? GIFTS.length : GIFTS.filter(function (g) { return g.cat === c.id; }).length;
      return '<button class="tab" data-id="' + esc(c.id) + '">' + esc(c.name) + "<small>" + n + "</small></button>";
    }).join("") +
      '<button class="tab top" data-id="top">' + TOP_TAB + (topOpen() ? "" : "<small>СКРЫТО</small>") + "</button>";
    Array.prototype.forEach.call(tabs.children, function (b) { b.classList.toggle("on", b.dataset.id === current); });
  }

  tabs.addEventListener("click", function (e) {
    var b = e.target.closest(".tab"); if (!b) return;
    current = b.dataset.id;
    try { history.replaceState(null, "", current === "all" ? location.pathname + location.search : "#" + current); } catch (_) {}
    render();
  });

  var h = decodeURIComponent((location.hash || "").slice(1));
  if (h && (h === "top" || CATEGORIES.some(function (c) { return c.id === h; }))) current = h;
  buildTabs();
  render();

  /* заставка */
  var intro = document.getElementById("intro");
  var done = false;
  function closeIntro() {
    if (done) return; done = true;
    intro.classList.add("out");
    setTimeout(function () { intro.remove(); document.body.classList.remove("locked"); }, 560);
  }
  intro.addEventListener("click", closeIntro);
  document.addEventListener("keydown", closeIntro);
  var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  setTimeout(closeIntro, reduce ? 1200 : 3000);
})();
</script>
</body>
</html>
